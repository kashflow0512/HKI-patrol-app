<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>香港道路維修緊急巡邏與自動回報系統</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #ff9800;
            --primary-hover: #e68a00;
            --success: #4caf50;
            --danger: #f44336;
            --text-main: #ffffff;
            --text-sub: #b0b0b0;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        header {
            background-color: var(--card-bg);
            padding: 12px 16px;
            border-bottom: 2px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btns {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .container {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quick-streets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-street {
            background-color: #2c2c2e;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-street.active {
            background-color: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 4px;
        }

        input:disabled {
            background-color: #1a1a1a;
            color: #888;
            border-color: #222;
        }

        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #capturedImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .watermark-preview {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            pointer-events: none;
            border-left: 3px solid var(--primary);
        }

        .camera-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 12px;
        }

        .btn-snap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #fff;
            border: 4px solid var(--primary);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        .btn-snap-inner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--danger);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-send {
            background-color: var(--success);
            color: white;
        }

        .btn-reset {
            background-color: #444;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            overflow-y: auto;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .history-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌧️ 香港道路維修緊急巡邏與自動回報</h1>
        <div class="header-btns">
            <button class="btn-icon" onclick="openHistoryModal()">📜</button>
            <button class="btn-icon" onclick="openSettingsModal()">⚙️</button>
        </div>
    </header>

    <div class="container">
        
        <!-- 街道選擇區 -->
        <div class="card">
            <div class="section-title">
                <span>選擇巡邏位置與街道</span>
            </div>
            <div class="quick-streets" id="quickStreetsContainer"></div>
            <input type="text" id="customStreet" placeholder="或手動輸入其他位置/街道名稱..." oninput="onCustomStreetInput(this.value)">
        </div>

        <!-- 相機拍照區 -->
        <div class="card">
            <div class="section-title">
                <span>現場拍照與自動定位</span>
                <button style="background:none; border:none; color:var(--primary); cursor:pointer;" onclick="switchCamera()">🔄 切換鏡頭</button>
            </div>
            
            <div class="camera-container">
                <video id="webcam" autoplay playsinline></video>
                <img id="capturedImage" alt="captured photo">
                <div class="watermark-preview" id="watermarkPreview">
                    📍 位置: 搜尋 GPS 中...<br>
                    🕒 時間: 取得時間中...<br>
                    🛣️ 街道: 請先選擇街道
                </div>
            </div>

            <div class="camera-controls">
                <button class="btn-snap" id="snapBtn" onclick="takePhoto()">
                    <div class="btn-snap-inner"></div>
                </button>
                <button class="btn-action btn-reset" id="retakeBtn" style="display:none; width:auto; padding:8px 16px;" onclick="resetCamera()">重拍</button>
            </div>
        </div>

        <!-- 發送報告按鈕 -->
        <div class="card">
            <button class="btn-action btn-send" id="sendBtn" onclick="sendReport()" disabled>
                ✉️ 開啟郵件 App 並發送報告
            </button>
        </div>

    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <!-- 設定解鎖密碼 Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content" style="max-width: 350px;">
            <div class="modal-header">
                <h3>🔐 管理員驗證</h3>
                <button class="btn-icon" onclick="closeModal('authModal')">✕</button>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 12px;">修改系統設定需要工程師密碼：</p>
            <input type="password" id="adminPasswordInput" placeholder="請輸入管理員密碼">
            <button class="btn-action btn-send" style="margin-top: 15px;" onclick="verifyAdminPassword()">確認解鎖</button>
        </div>
    </div>

    <!-- 設定 Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ 系統鎖定設定 (唯讀)</h3>
                <button class="btn-icon" onclick="closeModal('settingsModal')">✕</button>
            </div>

            <div style="background: rgba(255,152,0,0.1); border: 1px solid var(--primary); padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.80rem; color: #ffb74d;">
                💡 提示：收件人、副本與街道已統一鎖定。
            </div>
            
            <label style="font-size: 0.85rem; color: var(--text-sub);">寄件者電郵 (Sender):</label>
            <input type="text" id="cfgSenderEmail" disabled>

            <label style="font-size: 0.85rem; color: var(--text-sub); margin-top:10px; display:block;">接收電郵 (To):</label>
            <input type="text" id="cfgHydEmail" disabled>

            <label style="font-size: 0.85rem; color: var(--text-sub); margin-top:10px; display:block;">副本電郵 (CC):</label>
            <input type="text" id="cfgEngineerEmail" disabled>

            <div style="margin-top: 15px;">
                <label style="font-size: 0.85rem; color: var(--text-sub);">統一巡邏街道：</label>
                <div id="lockedStreetsList" style="margin-top: 6px; font-size: 0.9rem; color: #fff; background: #2a2a2a; padding: 10px; border-radius: 8px;"></div>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄 Modal -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📜 本機巡邏發送紀錄</h3>
                <button class="btn-icon" onclick="closeModal('historyModal')">✕</button>
            </div>
            <ul class="history-list" id="historyList">
                <li class="history-item">暫無紀錄</li>
            </ul>
        </div>
    </div>

    <script>
        var SYSTEM_CONFIG = {
            adminPass: "8888",
            senderEmail: "zenith@14hy2024-crbcfd.com",
            hydEmail: "plng@14hy2024-crbcfd.com; miowc1.u@hyd.gov.hk; miowc2.u@hyd.gov.hk; miowc3.u@hyd.gov.hk; maiowc2.u@hyd.gov.hk; mwsic2.u@hyd.gov.hk; mwsiic1.u@hyd.gov.hk; mwsiic2.u@hyd.gov.hk; mwsiic4.u@hyd.gov.hk; mwsic1.u@hyd.gov.hk",
            engineerEmail: "wkko@14hy2024-crbcfd.com; spwan@14hy2024-crbcfd.com",
            streets: [
                "Location 4 - 紅棉路 14HY2024",
                "Location 5 - 花園道 14HY2024",
                "太子道東",
                "龍翔道",
                "青山公路",
                "吐露港公路"
            ],
            senderName: "Desmond Ng",
            senderTitle: "CRBC-FD JV",
            senderTel: "5167 9235"
        };

        var currentStream = null;
        var facingMode = 'environment';
        var selectedStreet = '';
        var currentGPS = { lat: null, lng: null, text: '抓取 GPS 中...' };
        var capturedBlob = null;

        window.addEventListener('DOMContentLoaded', function() {
            initSystem();
            startCamera();
            startGPSWatch();
            setInterval(updateTimeDisplay, 1000);
        });

        function initSystem() {
            renderStreetButtons();
            var elSender = document.getElementById('cfgSenderEmail');
            var elHyd = document.getElementById('cfgHydEmail');
            var elEng = document.getElementById('cfgEngineerEmail');
            var elStreets = document.getElementById('lockedStreetsList');

            if (elSender) elSender.value = SYSTEM_CONFIG.senderEmail;
            if (elHyd) elHyd.value = SYSTEM_CONFIG.hydEmail;
            if (elEng) elEng.value = SYSTEM_CONFIG.engineerEmail;
            if (elStreets) elStreets.innerHTML = SYSTEM_CONFIG.streets.join('<br>');
        }

        function renderStreetButtons() {
            var container = document.getElementById('quickStreetsContainer');
            if (!container) return;
            container.innerHTML = '';
            SYSTEM_CONFIG.streets.forEach(function(street) {
                var btn = document.createElement('button');
                btn.className = 'btn-street' + (selectedStreet === street ? ' active' : '');
                btn.innerText = street;
                btn.onclick = function() { selectStreet(street); };
                container.appendChild(btn);
            });
        }

        function selectStreet(street) {
            selectedStreet = street;
            var customEl = document.getElementById('customStreet');
            if (customEl) customEl.value = '';
            renderStreetButtons();
            updateWatermarkText();
            validateForm();
        }

        function onCustomStreetInput(val) {
            selectedStreet = val.trim();
            renderStreetButtons();
            updateWatermarkText();
            validateForm();
        }

        function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(function(track) { track.stop(); });
            }
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } })
                .then(function(stream) {
                    currentStream = stream;
                    var video = document.getElementById('webcam');
                    if (video) video.srcObject = stream;
                })
                .catch(function(err) {
                    alert('無法讀取相機，請確保已授權相機存取權限。');
                });
            }
        }

        function switchCamera() {
            facingMode = (facingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        }

        function startGPSWatch() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    function(pos) {
                        currentGPS.lat = pos.coords.latitude.toFixed(5);
                        currentGPS.lng = pos.coords.longitude.toFixed(5);
                        currentGPS.text = currentGPS.lat + ', ' + currentGPS.lng;
                        updateWatermarkText();
                    },
                    function(err) {
                        currentGPS.text = 'GPS 定位失敗';
                        updateWatermarkText();
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                currentGPS.text = '裝置不支援 GPS';
                updateWatermarkText();
            }
        }

        function getFormattedDateCompact() {
            var now = new Date();
            return now.getFullYear().toString() +
                   String(now.getMonth() + 1).padStart(2, '0') +
                   String(now.getDate()).padStart(2, '0');
        }

        function getFormattedTime() {
            var now = new Date();
            return now.getFullYear() + '-' +
                   String(now.getMonth() + 1).padStart(2, '0') + '-' +
                   String(now.getDate()).padStart(2, '0') + ' ' +
                   String(now.getHours()).padStart(2, '0') + ':' +
                   String(now.getMinutes()).padStart(2, '0');
        }

        function updateTimeDisplay() { updateWatermarkText(); }

        function updateWatermarkText() {
            var streetText = selectedStreet || '請先選擇街道';
            var timeText = getFormattedTime();
            var elPreview = document.getElementById('watermarkPreview');
            if (elPreview) {
                elPreview.innerHTML = '📍 位置: ' + currentGPS.text + '<br>🕒 時間: ' + timeText + '<br>🛣️ 街道: ' + streetText;
            }
        }

        function takePhoto() {
            if (!selectedStreet) {
                alert('請先點選巡邏位置或街道名稱！');
                return;
            }

            var video = document.getElementById('webcam');
            var canvas = document.getElementById('canvas');
            if (!video || !canvas) return;
            var ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            var bannerHeight = 80;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, canvas.height - bannerHeight, canvas.width, bannerHeight);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('位置: ' + selectedStreet, 15, canvas.height - 50);
            
            ctx.fillStyle = '#ff9800';
            ctx.font = '14px Arial';
            ctx.fillText('時間: ' + getFormattedTime() + '  |  GPS: ' + currentGPS.text, 15, canvas.height - 20);

            canvas.toBlob(function(blob) {
                capturedBlob = blob;
                var imgUrl = URL.createObjectURL(blob);
                var imgElem = document.getElementById('capturedImage');
                if (imgElem) {
                    imgElem.src = imgUrl;
                    imgElem.style.display = 'block';
                }
                video.style.display = 'none';

                var snapBtn = document.getElementById('snapBtn');
                var retakeBtn = document.getElementById('retakeBtn');
                if (snapBtn) snapBtn.style.display = 'none';
                if (retakeBtn) retakeBtn.style.display = 'block';
                
                validateForm();
            }, 'image/jpeg', 0.85);
        }

        function resetCamera() {
            var imgElem = document.getElementById('capturedImage');
            var video = document.getElementById('webcam');
            var snapBtn = document.getElementById('snapBtn');
            var retakeBtn = document.getElementById('retakeBtn');

            if (imgElem) imgElem.style.display = 'none';
            if (video) video.style.display = 'block';
            if (snapBtn) snapBtn.style.display = 'flex';
            if (retakeBtn) retakeBtn.style.display = 'none';
            
            capturedBlob = null;
            validateForm();
        }

        function validateForm() {
            var sendBtn = document.getElementById('sendBtn');
            if (!sendBtn) return;
            if (selectedStreet && capturedBlob) {
                sendBtn.disabled = false;
                sendBtn.style.opacity = '1';
            } else {
                sendBtn.disabled = true;
                sendBtn.style.opacity = '0.5';
            }
        }

        function sendReport() {
            var dateCompact = getFormattedDateCompact();
            var subject = selectedStreet + ' - Amber Pothole Gang Photo (Central) ' + dateCompact;
            
            var body = 'Dear Sir,\n\n' +
                       'FYI.\n\n' +
                       'GPS 座標參考: ' + currentGPS.text + ' (Maps: https://maps.google.com/?q=' + currentGPS.lat + ',' + currentGPS.lng + ')\n\n' +
                       'Best Regards,\n\n' +
                       SYSTEM_CONFIG.senderName + '\n' +
                       SYSTEM_CONFIG.senderTitle + '\n' +
                       'Tel: ' + SYSTEM_CONFIG.senderTel;

            var mailtoUrl = 'mailto:' + encodeURIComponent(SYSTEM_CONFIG.hydEmail) + 
                            '?cc=' + encodeURIComponent(SYSTEM_CONFIG.engineerEmail) + 
                            '&subject=' + encodeURIComponent(subject) + 
                            '&body=' + encodeURIComponent(body);
            
            window.location.href = mailtoUrl;
            saveHistory(selectedStreet, getFormattedTime(), '已成功調用郵件 App');
            
            setTimeout(function() {
                alert('💡 提示：請在開啟的郵件 App 中，將剛才拍好的巡邏相片「附加」到信件中即可發送！');
                resetCamera();
            }, 1000);
        }

        function saveHistory(street, time, status) {
            var history = JSON.parse(localStorage.getItem('patrol_history') || '[]');
            history.unshift({ street: street, time: time, status: status });
            if (history.length > 20) history.pop();
            localStorage.setItem('patrol_history', JSON.stringify(history));
        }

        function openHistoryModal() {
            var list = document.getElementById('historyList');
            var history = JSON.parse(localStorage.getItem('patrol_history') || '[]');
            if (!list) return;
            if (history.length === 0) {
                list.innerHTML = '<li class="history-item">暫無歷史紀錄</li>';
            } else {
                list.innerHTML = history.map(function(h) {
                    return '<li class="history-item">' +
                           '<div><strong>' + h.street + '</strong><br><span style="color:#888;">' + h.time + '</span></div>' +
                           '<div style="color:var(--primary);">' + h.status + '</div>' +
                           '</li>';
                }).join('');
            }
            document.getElementById('historyModal').style.display = 'block';
        }

        function openSettingsModal() {
            var pwdInput = document.getElementById('adminPasswordInput');
            if (pwdInput) pwdInput.value = '';
            document.getElementById('authModal').style.display = 'block';
        }

        function verifyAdminPassword() {
            var pwdInput = document.getElementById('adminPasswordInput');
            if (pwdInput && pwdInput.value === SYSTEM_CONFIG.adminPass) {
                closeModal('authModal');
                document.getElementById('settingsModal').style.display = 'block';
            } else {
                alert('❌ 密碼錯誤！');
            }
        }

        function closeModal(id) {
            var el = document.getElementById(id);
            if (el) el.style.display = 'none';
        }
    </script>
</body>
</html>
