<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>香港道路維修緊急巡邏與自動回報系統</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #ff9800;
            --primary-hover: #e68a00;
            --success: #4caf50;
            --danger: #f44336;
            --text-main: #ffffff;
            --text-sub: #b0b0b0;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        header {
            background-color: var(--card-bg);
            padding: 12px 16px;
            border-bottom: 2px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btns {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .container {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quick-streets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-street {
            background-color: #2c2c2e;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 6px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-street.active {
            background-color: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 4px;
        }

        input:disabled {
            background-color: #1a1a1a;
            color: #888;
            border-color: #222;
        }

        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #capturedImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .watermark-preview {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            pointer-events: none;
            border-left: 3px solid var(--primary);
        }

        .camera-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 12px;
        }

        .btn-snap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #fff;
            border: 4px solid var(--primary);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        .btn-snap-inner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--danger);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-send {
            background-color: var(--success);
            color: white;
        }

        .btn-reset {
            background-color: #444;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            overflow-y: auto;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .history-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌧️ 香港街道巡邏自動回報</h1>
        <div class="header-btns">
            <button class="btn-icon" onclick="openHistoryModal()">📜</button>
            <button class="btn-icon" onclick="openSettingsModal()">⚙️</button>
        </div>
    </header>

    <div class="container">
        
        <!-- 街道選擇區 -->
        <div class="card">
            <div class="section-title">
                <span>選擇巡邏街道</span>
            </div>
            <div class="quick-streets" id="quickStreetsContainer"></div>
            <input type="text" id="customStreet" placeholder="或手動輸入其他街道名稱..." oninput="onCustomStreetInput(this.value)">
        </div>

        <!-- 相機拍照區 -->
        <div class="card">
            <div class="section-title">
                <span>現場拍照與自動定位</span>
                <button style="background:none; border:none; color:var(--primary); cursor:pointer;" onclick="switchCamera()">🔄 切換鏡頭</button>
            </div>
            
            <div class="camera-container">
                <video id="webcam" autoplay playsinline></video>
                <img id="capturedImage" alt="captured photo">
                <div class="watermark-preview" id="watermarkPreview">
                    📍 位置: 搜尋 GPS 中...<br>
                    🕒 時間: 取得時間中...<br>
                    🛣️ 街道: 請先選擇街道
                </div>
            </div>

            <div class="camera-controls">
                <button class="btn-snap" id="snapBtn" onclick="takePhoto()">
                    <div class="btn-snap-inner"></div>
                </button>
                <button class="btn-action btn-reset" id="retakeBtn" style="display:none; width:auto; padding:8px 16px;" onclick="resetCamera()">重拍</button>
            </div>
        </div>

        <!-- 發送報告按鈕 -->
        <div class="card">
            <button class="btn-action btn-send" id="sendBtn" onclick="sendReport()" disabled>
                ✉️ 完成並自動發送電郵
            </button>
        </div>

    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <!-- 設定解鎖密碼 Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content" style="max-width: 350px;">
            <div class="modal-header">
                <h3>🔐 管理員驗證</h3>
                <button class="btn-icon" onclick="closeModal('authModal')">✕</button>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 12px;">修改系統設定需要工程師密碼：</p>
            <input type="password" id="adminPasswordInput" placeholder="請輸入管理員密碼">
            <button class="btn-action btn-send" style="margin-top: 15px;" onclick="verifyAdminPassword()">確認解鎖</button>
        </div>
    </div>

    <!-- 設定 Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ 系統鎖定設定 (唯讀)</h3>
                <button class="btn-icon" onclick="closeModal('settingsModal')">✕</button>
            </div>

            <div style="background: rgba(255,152,0,0.1); border: 1px solid var(--primary); padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.8rem; color: #ffb74d;">
                💡 提示：所有電郵與街道已透過系統統一鎖定。工友在任何裝置打開本網頁，都會直接同步使用以下設定。
            </div>
            
            <label style="font-size: 0.85rem; color: var(--text-sub);">公司指定寄件者電郵 (Sender From):</label>
            <input type="text" id="cfgSenderEmail" disabled>
            
            <label style="font-size: 0.85rem; color: var(--text-sub); margin-top:10px; display:block;">路政署接收電郵 (To):</label>
            <input type="text" id="cfgHydEmail" disabled>

            <label style="font-size: 0.85rem; color: var(--text-sub); margin-top:10px; display:block;">工程師副本電郵 (CC):</label>
            <input type="text" id="cfgEngineerEmail" disabled>

            <label style="font-size: 0.85rem; color: var(--text-sub); margin-top:10px; display:block;">後端發信 API (Formspree Endpoint):</label>
            <input type="text" id="cfgApiEndpoint" disabled>

            <div style="margin-top: 15px;">
                <label style="font-size: 0.85rem; color: var(--text-sub);">全公司統一預設巡邏街道：</label>
                <div id="lockedStreetsList" style="margin-top: 6px; font-size: 0.9rem; color: #fff; background: #2a2a2a; padding: 10px; border-radius: 8px;"></div>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄 Modal -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📜 本機巡邏發送紀錄</h3>
                <button class="btn-icon" onclick="closeModal('historyModal')">✕</button>
            </div>
            <ul class="history-list" id="historyList">
                <li class="history-item">暫無紀錄</li>
            </ul>
        </div>
    </div>

    <script>
        // ==================== 🛠️ 工程師核心統一設定 (在此修改，全網同步) ====================
        const SYSTEM_CONFIG = {
            adminPass: "8888",                                       // 工程師解鎖設定的密碼
            senderEmail: "patrol@yourcompany.com.hk",               // 統一公司寄件電郵
            hydEmail: "enquiry@hyd.gov.hk",                          // 統一路政署電郵
            engineerEmail: "engineer@yourcompany.com.hk",            // 統一工程師 CC 電郵
            apiEndpoint: "https://formspree.io/f/mgaazwjz", // 統一 API 網址
            streets: ['觀塘道', '太子道東', '龍翔道', '青山公路', '吐露港公路', '德輔道中', '軒尼詩道'] // 統一巡邏街道
        };
        // =====================================================================================

        let currentStream = null;
        let facingMode = 'environment';
        let selectedStreet = '';
        let currentGPS = { lat: null, lng: null, text: '抓取 GPS 中...' };
        let capturedBlob = null;

        window.onload = () => {
            initSystem();
            startCamera();
            startGPSWatch();
            setInterval(updateTimeDisplay, 1000);
        };

        // 初始化系統：強制載入統一設定，不依賴個別手機記憶
        function initSystem() {
            renderStreetButtons();

            // 填入設定畫面（唯讀）
            document.getElementById('cfgSenderEmail').value = SYSTEM_CONFIG.senderEmail;
            document.getElementById('cfgHydEmail').value = SYSTEM_CONFIG.hydEmail;
            document.getElementById('cfgEngineerEmail').value = SYSTEM_CONFIG.engineerEmail;
            document.getElementById('cfgApiEndpoint').value = SYSTEM_CONFIG.apiEndpoint;

            // 渲染街道列表
            const streetListDiv = document.getElementById('lockedStreetsList');
            streetListDiv.innerHTML = SYSTEM_CONFIG.streets.join('、');
        }

        function renderStreetButtons() {
            const container = document.getElementById('quickStreetsContainer');
            container.innerHTML = '';

            SYSTEM_CONFIG.streets.forEach(street => {
                const btn = document.createElement('button');
                btn.className = `btn-street ${selectedStreet === street ? 'active' : ''}`;
                btn.innerText = street;
                btn.onclick = () => selectStreet(street);
                container.appendChild(btn);
            });
        }

        function selectStreet(street) {
            selectedStreet = street;
            document.getElementById('customStreet').value = '';
            renderStreetButtons();
            updateWatermarkText();
            validateForm();
        }

        function onCustomStreetInput(val) {
            selectedStreet = val.trim();
            renderStreetButtons();
            updateWatermarkText();
            validateForm();
        }

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = { video: { facingMode: facingMode } };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('webcam').srcObject = currentStream;
            } catch (err) {
                alert('無法讀取相機，請確保已授權相機存取權限。');
            }
        }

        function switchCamera() {
            facingMode = (facingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        }

        function startGPSWatch() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        currentGPS.lat = pos.coords.latitude.toFixed(5);
                        currentGPS.lng = pos.coords.longitude.toFixed(5);
                        currentGPS.text = `${currentGPS.lat}, ${currentGPS.lng}`;
                        updateWatermarkText();
                    },
                    (err) => {
                        currentGPS.text = 'GPS 定位失敗';
                        updateWatermarkText();
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                currentGPS.text = '裝置不支援 GPS';
                updateWatermarkText();
            }
        }

        function getFormattedTime() {
            const now = new Date();
            return now.getFullYear() + '-' +
                   String(now.getMonth() + 1).padStart(2, '0') + '-' +
                   String(now.getDate()).padStart(2, '0') + ' ' +
                   String(now.getHours()).padStart(2, '0') + ':' +
                   String(now.getMinutes()).padStart(2, '0') + ':' +
                   String(now.getSeconds()).padStart(2, '0');
        }

        function updateTimeDisplay() { updateWatermarkText(); }

        function updateWatermarkText() {
            const streetText = selectedStreet || '請先選擇街道';
            const timeText = getFormattedTime();
            document.getElementById('watermarkPreview').innerHTML = 
                `📍 位置: ${currentGPS.text}<br>🕒 時間: ${timeText}<br>🛣️ 街道: ${streetText}`;
        }

        function takePhoto() {
            if (!selectedStreet) {
                alert('請先點選巡邏街道名稱！');
                return;
            }

            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const bannerHeight = 80;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, canvas.height - bannerHeight, canvas.width, bannerHeight);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px Arial';
            ctx.fillText(`街道: ${selectedStreet}`, 15, canvas.height - 50);
            
            ctx.fillStyle = '#ff9800';
            ctx.font = '14px Arial';
            const timeStr = getFormattedTime();
            ctx.fillText(`時間: ${timeStr}  |  GPS: ${currentGPS.text}`, 15, canvas.height - 20);

            canvas.toBlob((blob) => {
                capturedBlob = blob;
                const imgUrl = URL.createObjectURL(blob);
                const imgElem = document.getElementById('capturedImage');
                imgElem.src = imgUrl;
                imgElem.style.display = 'block';
                video.style.display = 'none';

                document.getElementById('snapBtn').style.display = 'none';
                document.getElementById('retakeBtn').style.display = 'block';
                
                validateForm();
            }, 'image/jpeg', 0.85);
        }

        function resetCamera() {
            document.getElementById('capturedImage').style.display = 'none';
            document.getElementById('webcam').style.display = 'block';
            document.getElementById('snapBtn').style.display = 'flex';
            document.getElementById('retakeBtn').style.display = 'none';
            capturedBlob = null;
            validateForm();
        }

        function validateForm() {
            const sendBtn = document.getElementById('sendBtn');
            if (selectedStreet && capturedBlob) {
                sendBtn.disabled = false;
                sendBtn.style.opacity = '1';
            } else {
                sendBtn.disabled = true;
                sendBtn.style.opacity = '0.5';
            }
        }

        async function sendReport() {
            // 直接讀取 SYSTEM_CONFIG 統一常數，確保全裝置發往相同信箱
            const hydEmail = SYSTEM_CONFIG.hydEmail;
            const engEmail = SYSTEM_CONFIG.engineerEmail;
            const senderEmail = SYSTEM_CONFIG.senderEmail;
            const apiEndpoint = SYSTEM_CONFIG.apiEndpoint;
            const nowTime = getFormattedTime();

            const subject = `[巡邏回報] 惡劣天氣街道巡查報告 - ${selectedStreet} - ${nowTime}`;
            const body = `路政署 執照及巡邏組：\n\n` +
                         `這是最新的緊急街道巡邏拍照報告：\n` +
                         `-----------------------------------\n` +
                         `巡邏街道：${selectedStreet}\n` +
                         `巡邏時間：${nowTime}\n` +
                         `現場座標：${currentGPS.text}\n` +
                         `Google Maps: https://maps.google.com/?q=${currentGPS.lat},${currentGPS.lng}\n` +
                         `發送公司電郵：${senderEmail}\n` +
                         `-----------------------------------\n` +
                         `現場相片已附件於本郵件。`;

            if (apiEndpoint && !apiEndpoint.includes("YOUR_FORMSPREE_ID")) {
                alert('正在透過公司統一 API 背景自動發送電郵至路政署...');
                const formData = new FormData();
                formData.append('to', hydEmail);
                formData.append('cc', engEmail);
                formData.append('from', senderEmail);
                formData.append('subject', subject);
                formData.append('message', body);
                formData.append('photo', capturedBlob, `patrol_${selectedStreet}_${Date.now()}.jpg`);

                try {
                    const response = await fetch(apiEndpoint, { method: 'POST', body: formData, headers: { 'Accept': 'application/json' } });
                    if (response.ok) {
                        alert('✅ 發送成功！路政署及工程師已收到報告。');
                        saveHistory(selectedStreet, nowTime, 'API 自動發送成功');
                        resetCamera();
                    } else {
                        throw new Error('API 回應異常');
                    }
                } catch (e) {
                    alert('❌ API 背景發送失敗，將切換至調用手機 Mail 軟體發送。');
                    fallbackToMailto(hydEmail, engEmail, subject, body);
                }
            } else {
                fallbackToMailto(hydEmail, engEmail, subject, body);
            }
        }

        function fallbackToMailto(to, cc, subject, body) {
            const mailtoUrl = `mailto:${encodeURIComponent(to)}?cc=${encodeURIComponent(cc)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailtoUrl;
            saveHistory(selectedStreet, getFormattedTime(), '已喚起 Email App');
        }

        function saveHistory(street, time, status) {
            let history = JSON.parse(localStorage.getItem('patrol_history') || '[]');
            history.unshift({ street, time, status });
            if (history.length > 20) history.pop();
            localStorage.setItem('patrol_history', JSON.stringify(history));
        }

        function openHistoryModal() {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('patrol_history') || '[]');
            if (history.length === 0) {
                list.innerHTML = '<li class="history-item">暫無歷史紀錄</li>';
            } else {
                list.innerHTML = history.map(h => 
                    `<li class="history-item">
                        <div><strong>${h.street}</strong><br><span style="color:#888;">${h.time}</span></div>
                        <div style="color:var(--primary);">${h.status}</div>
                    </li>`
                ).join('');
            }
            document.getElementById('historyModal').style.display = 'block';
        }

        // 點擊設定時先跳出密碼驗證
        function openSettingsModal() {
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('authModal').style.display = 'block';
        }

        function verifyAdminPassword() {
            const pwd = document.getElementById('adminPasswordInput').value;
            if (pwd === SYSTEM_CONFIG.adminPass) {
                closeModal('authModal');
                document.getElementById('settingsModal').style.display = 'block';
            } else {
                alert('❌ 密碼錯誤！只有工程師才能檢視系統設定。');
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
